# FINN daily refresh: runs the same job as `python refresh.py` on the laptop, then
# commits the updated database. Render redeploys from main by itself, so the app
# shows the new day's filings, cards and alerts without anyone touching it.
name: Daily refresh

on:
  schedule:
    - cron: "30 13 * * 1-5"   # 13:30 UTC = 19:00 IST, Monday to Friday, after market close
  workflow_dispatch: {}        # "Run workflow" button in the Actions tab

permissions:
  contents: write              # lets the job push the updated finn.db

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Refresh (prices, NSE filings, classify, cards, events)
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python refresh.py

      - name: Cross-check results cards against screener
        working-directory: backend
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python push/results_check.py

      - name: Commit the updated database
        run: |
          if git diff --quiet -- backend/data/finn.db; then
            echo "No new data today."
            exit 0
          fi
          git config user.name "finn-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/finn.db
          git commit -m "FINN daily refresh $(date -u +%Y-%m-%d)"
          git push
